services:
  - type: web
    name: nonesocial-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://your-frontend-url.vercel.app
    # After deployment, update CLIENT_URL with your actual Vercel URL
